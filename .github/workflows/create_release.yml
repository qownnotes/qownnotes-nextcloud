name: "🗃️ Create release"

# Creates a draft release with the release notes of the version in appinfo/info.xml from CHANGELOG.md.
# The signed release archive is created locally with `just sign-app` and attached to it, see docs/release.md.

on:
  push:
    branches:
      - release
    tags-ignore:
      - "*"
  workflow_dispatch:

jobs:
  create_release:
    name: "🗃️ Create draft release"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v5

      - name: "🔢 Read version and release notes"
        run: |
          python3 -m unittest discover -s tests/release
          VERSION=$(python3 scripts/check-release.py --notes-output release-notes.md)
          echo "VERSION=${VERSION}" >>"$GITHUB_ENV"
          cat release-notes.md

      - name: "🗃️ Create draft release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ env.VERSION }}
          body_path: release-notes.md
          draft: true
          prerelease: false
