name: "🗃️ Sign and publish release"

on:
  push:
    branches:
      - release

permissions:
  contents: read

concurrency:
  group: signed-release
  cancel-in-progress: false

jobs:
  validate:
    name: "🔢 Validate versions and changelog"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: "🔢 Check all release versions and extract changelog"
        id: metadata
        run: |
          python3 -m unittest discover -s tests/release
          VERSION=$(python3 scripts/check-release.py --notes-output release-notes.md)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cat release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes-${{ github.sha }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  prepare:
    name: "🔧 Build and test frontend"
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes-${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: "🔧 Build and test frontend"
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          python3 scripts/check-release.py --built
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-inputs-${{ github.sha }}
          path: |
            js/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  format:
    name: "📄 Formatting checks"
    needs: validate
    uses: ./.github/workflows/format-check.yml

  sign:
    name: "🔐 Sign and verify exact archive"
    needs: [prepare, format]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs-${{ github.sha }}
      - name: "🔐 Sign, install and check integrity"
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: sh scripts/ci-sign-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: |
            build/qownnotes-${{ needs.prepare.outputs.version }}.tar.gz
            build/qownnotes-${{ needs.prepare.outputs.version }}.tar.gz.sig
            build/qownnotes-${{ needs.prepare.outputs.version }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  github:
    name: "🚀 Publish GitHub release"
    needs: [prepare, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-inputs-${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - name: "🚀 Publish verified archive with changelog description"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-github-release.py --commit "$GITHUB_SHA"

  appstore:
    name: "☁️ Publish Nextcloud App Store release"
    needs: [prepare, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-${{ github.sha }}
          path: build
      - name: "☁️ Submit public download URL and existing signature"
        env:
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/publish-appstore.py \
            --download-url "https://github.com/$RELEASE_REPOSITORY/releases/download/v$RELEASE_VERSION/qownnotes-$RELEASE_VERSION.tar.gz" \
            --signature "build/qownnotes-$RELEASE_VERSION.tar.gz.sig" \
            --archive "build/qownnotes-$RELEASE_VERSION.tar.gz"
