name: qownnotes-nextcloud

services:
  app:
    image: nextcloud:${NEXTCLOUD_VERSION:-33}-apache
    ports:
      - 8081:80
    environment:
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=admin
      - SQLITE_DATABASE=nextcloud
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost 127.0.0.1
    volumes:
      - nextcloud:/var/www/html
      - ..:/var/www/html/custom_apps/qownnotes
      - ./hooks/before-starting.sh:/docker-entrypoint-hooks.d/before-starting/qownnotes.sh:ro

volumes:
  nextcloud:
